[project]
name = "cimtables"
version = "0.1.0"
description = "The .cimtbl DSL: parser, profile-reflective validator, and graph-write/binder core for cim-graph"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "DISCLAIMER.md"]
keywords = ["cim", "power-systems", "dsl", "cim-graph", "grid-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    # pre-1.0, and cimtables reflects on their internals: pin below the next minor
    "cim-graph>=0.6.0a0,<0.7",
    "cimprofiles>=0.1.0a4,<0.2",
    "lark>=1.1.9",
]

[project.urls]
Homepage = "https://github.com/PNNL-CIM-Tools/CIM-Tables"
Documentation = "https://github.com/PNNL-CIM-Tools/CIM-Tables/blob/main/docs/CIMTBL_DESIGN.md"
Repository = "https://github.com/PNNL-CIM-Tools/CIM-Tables"
Issues = "https://github.com/PNNL-CIM-Tools/CIM-Tables/issues"
Models = "https://github.com/PNNL-CIM-Tools/CIMTBL-Models"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv]
# cim-graph and its deps (gridappsd-python) are pre-release builds
prerelease = "allow"

# Local development against sibling checkouts of CIM-Graph and CIM-Profiles.
[tool.uv.sources]
cim-graph = { path = "../CIM-Graph", editable = true }
cimprofiles = { path = "../CIM-Profiles", editable = true }

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license / license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimtables"]

[tool.hatch.build.targets.sdist]
include = [
    "/cimtables",
    "/tests",
    "/docs",
    "README.md",
    "LICENSE",
    "DISCLAIMER.md",
]
