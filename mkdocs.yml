site_name: CIM-Tables
site_url: https://pnnl-cim-tools.github.io/CIM-Tables/
site_description: .cimtbl, a plain-text table format for IEC CIM power-system models, and the cimtables package that loads it into cim-graph
site_author: PNNL CIM Tools
repo_url: https://github.com/PNNL-CIM-Tools/CIM-Tables
repo_name: PNNL-CIM-Tools/CIM-Tables
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2026 Battelle Memorial Institute. BSD 3-Clause.

theme:
  name: material
  icon:
    logo: material/table-network
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false          # outputs are stored in the notebooks (see Developer docs > Building the docs)
      ignore_h1_titles: true
      show_input: true
      markdown_cell_processor: mkdocs

not_in_nav: |
  guide/*.cimtbl

validation:
  anchors: warn          # --strict fails on a link to a missing heading
  unrecognized_links: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PNNL-CIM-Tools/CIM-Tables
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cim-tables/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Getting started:
          - Installation: guide/installation.md
          - Quick start: guide/quickstart.ipynb
      - Writing a model:
          - The format: guide/format.md
          - Connectivity and phases: guide/connectivity.md
          - Units and impedance bases: guide/units.md
          - When something is wrong: guide/errors.md
      - Using it from Python:
          - Python API: guide/python-api.md
          - CIM XML to .cimtbl: guide/round_trip.ipynb
  - Developer docs:
      - developer/index.md
      - The grammar: developer/grammar.md
      - Loading a file: developer/loading.md
      - Binding a row: developer/binding.md
      - Writing .cimtbl: developer/writing.md
      - Design record: CIMTBL_DESIGN.md
